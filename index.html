<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="낱말카드">
  <title>낱말 카드</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 카테고리 선택 화면 -->
  <main id="home" class="screen">
    <header class="home-head">
      <h1>낱말 카드</h1>
      <p>보고, 듣고, 말해 봐요!</p>
    </header>
    <div id="categories" class="cat-grid"></div>
    <footer class="home-foot"><a href="credits.html">사진·소리 출처</a></footer>
  </main>

  <!-- 카드 화면 -->
  <section id="deck" class="screen" hidden>
    <header class="deck-head">
      <button id="back" class="icon-btn" aria-label="처음으로">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="deck-title"></h2>
      <button id="sound" class="icon-btn" aria-label="소리 켜기/끄기" aria-pressed="true">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </header>

    <div class="stage">
      <button id="prev" class="nav-btn" aria-label="이전 카드">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="card" class="card" role="button" tabindex="0" aria-live="polite">
        <div class="card-img"><img id="card-img" alt="" draggable="false"></div>
        <button id="card-sound" class="sound-btn" aria-label="소리 듣기" hidden>
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>
          <span id="card-sound-text"></span>
        </button>
        <div class="card-text">
          <div id="card-ko" class="ko"></div>
          <div id="card-en" class="en"></div>
        </div>
      </div>
      <button id="next" class="nav-btn" aria-label="다음 카드">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <footer class="deck-foot">
      <div id="dots" class="dots"></div>
      <div id="counter" class="counter"></div>
    </footer>
  </section>

  <script src="data/words.js"></script>
  <script src="app.js"></script>
</body>
</html>
